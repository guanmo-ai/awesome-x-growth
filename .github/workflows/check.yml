name: Check library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:repo
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:release
